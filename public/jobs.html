<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jobs — Asset Tracker</title>
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3350;
  --accent:#4f6ef7;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;
  --purple:#7c3aed;--text:#e2e8f0;--muted:#8892b0;--radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 28px;background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;gap:12px;flex-wrap:wrap;
}
.logo{display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:700;text-decoration:none;color:var(--text);}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:7px 14px;font-size:0.85rem;font-weight:600;color:var(--text);
  text-decoration:none;transition:border-color 0.15s;
}
.back-btn:hover{border-color:var(--accent);}
.user-badge{font-size:0.78rem;color:var(--muted);}
button{cursor:pointer;border:none;border-radius:8px;font-size:0.85rem;font-weight:600;padding:8px 16px;transition:opacity 0.15s;}
button:hover{opacity:0.87;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-sm{padding:5px 12px;font-size:0.78rem;}
.page{padding:28px 32px;max-width:100%;margin:0 auto;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:14px;}
.page-header-left h1{font-size:1.5rem;font-weight:800;margin-bottom:4px;}
.page-header-left p{color:var(--muted);font-size:0.85rem;}
.page-header-right{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:24px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;}
.stat-val{font-size:1.7rem;font-weight:800;line-height:1;}
.stat-lbl{font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-top:4px;}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px;}
.toolbar input,.toolbar select{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:8px 13px;color:var(--text);font-size:0.85rem;outline:none;
}
.toolbar input{min-width:200px;}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent);}
.status-toggle{display:flex;gap:3px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:3px;}
.status-btn{
  background:transparent;color:var(--muted);border:none;border-radius:7px;
  padding:5px 14px;font-size:0.8rem;font-weight:600;
  transition:background 0.15s,color 0.15s;cursor:pointer;
}
.status-btn.active{background:var(--accent);color:#fff;}
.sync-bar{
  display:flex;align-items:center;gap:10px;margin-bottom:20px;
  font-size:0.8rem;color:var(--muted);padding:8px 12px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
}
.sync-bar span{flex:1;}
.loading-wrap{text-align:center;padding:60px 20px;color:var(--muted);}
.loader{
  display:inline-block;width:22px;height:22px;
  border:2px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-wrap{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-icon{font-size:2.8rem;margin-bottom:12px;}
.kanban-wrap{overflow-x:auto;padding-bottom:16px;}
.kanban-board{display:grid;grid-template-columns:repeat(4,minmax(280px,1fr));gap:16px;min-width:1120px;}
.kanban-col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;}
.kanban-col-header{display:flex;align-items:center;gap:8px;font-weight:700;font-size:0.9rem;padding-bottom:12px;border-bottom:1px solid var(--border);}
.col-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.col-count{margin-left:auto;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px 9px;font-size:0.72rem;color:var(--muted);}
.kanban-cards{display:flex;flex-direction:column;gap:10px;min-height:80px;}
.job-card{
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:14px;cursor:pointer;transition:border-color 0.18s,transform 0.15s,box-shadow 0.15s;
  position:relative;overflow:hidden;
}
.job-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;}
.job-card.status-wo::before{background:var(--green);}
.job-card.status-quote::before{background:var(--amber);}
.job-card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,0.25);}
.job-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;}
.job-number{font-size:0.72rem;font-weight:700;color:var(--accent);}
.job-status-badge{font-size:0.65rem;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap;flex-shrink:0;}
.job-status-badge.wo{background:rgba(34,197,94,0.15);color:var(--green);}
.job-status-badge.quote{background:rgba(245,158,11,0.15);color:var(--amber);}
.job-desc{font-weight:600;font-size:0.85rem;margin-bottom:6px;line-height:1.4;}
.job-client{font-size:0.75rem;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:4px;}
.job-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:0.72rem;color:var(--muted);margin-bottom:8px;}
.job-meta-item{display:flex;align-items:center;gap:3px;}
.job-booking{
  display:flex;align-items:center;gap:6px;
  background:rgba(79,110,247,0.08);border:1px solid rgba(79,110,247,0.2);
  border-radius:6px;padding:5px 8px;font-size:0.72rem;margin-bottom:8px;
}
.job-booking.has-booking{background:rgba(34,197,94,0.08);border-color:rgba(34,197,94,0.25);color:var(--green);}
.job-booking.no-booking{color:var(--muted);}
.job-card-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.open-sm8-btn{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(79,110,247,0.1);border:1px solid rgba(79,110,247,0.25);
  border-radius:6px;padding:3px 8px;font-size:0.68rem;color:var(--accent);
  font-weight:600;text-decoration:none;white-space:nowrap;
}
.open-sm8-btn:hover{background:rgba(79,110,247,0.22);}
.parts-link-btn{
  display:inline-flex;align-items:center;gap:4px;
  border-radius:6px;padding:3px 8px;font-size:0.68rem;
  font-weight:600;text-decoration:none;white-space:nowrap;
}
.parts-link-btn.all-received{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:var(--green);}
.parts-link-btn.some-ordered{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--amber);}
.parts-link-btn.needs-order{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--red);}
.parts-link-btn.no-parts{background:rgba(136,146,176,0.08);border:1px solid rgba(136,146,176,0.15);color:var(--muted);}
.no-jobs{color:var(--muted);font-size:0.8rem;text-align:center;padding:20px 0;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;width:100%;max-width:680px;max-height:92vh;overflow-y:auto;position:relative;}
.modal-close{position:absolute;top:14px;right:14px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:4px 10px;font-size:1rem;cursor:pointer;}
.modal-close:hover{border-color:var(--accent);}
.modal h3{font-size:1.1rem;font-weight:700;margin-bottom:4px;}
.modal-sub{font-size:0.82rem;color:var(--muted);margin-bottom:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.modal-sm8-link{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(79,110,247,0.1);border:1px solid rgba(79,110,247,0.3);
  border-radius:8px;padding:7px 14px;font-size:0.82rem;font-weight:600;
  color:var(--accent);text-decoration:none;margin-bottom:18px;
}
.modal-sm8-link:hover{background:rgba(79,110,247,0.2);}
.modal-section{margin-bottom:18px;}
.modal-section-title{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.field-row{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border);}
.field-row:last-child{border-bottom:none;}
.field-label{font-size:0.8rem;color:var(--muted);}
.field-value{font-size:0.85rem;font-weight:500;text-align:right;max-width:65%;}
.booking-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;}
.booking-card.next{border-color:rgba(34,197,94,0.4);background:rgba(34,197,94,0.05);}
.booking-date{font-size:1rem;font-weight:700;color:var(--green);margin-bottom:4px;}
.booking-time{font-size:0.82rem;color:var(--muted);margin-bottom:4px;}
.booking-staff{font-size:0.78rem;color:var(--accent);}
.booking-label{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--green);margin-bottom:6px;}
.badge{display:inline-block;font-size:0.67rem;font-weight:700;padding:2px 7px;border-radius:7px;}
.badge-wo{background:rgba(34,197,94,0.13);color:var(--green);}
.badge-quote{background:rgba(245,158,11,0.13);color:var(--amber);}
.materials-table{width:100%;border-collapse:collapse;margin-top:4px;}
.materials-table th{text-align:left;padding:7px 10px;font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;border-bottom:2px solid var(--border);}
.materials-table td{padding:7px 10px;font-size:0.82rem;border-bottom:1px solid var(--border);vertical-align:top;}
.materials-table tr:last-child td{border-bottom:none;}
.materials-table tr:hover td{background:rgba(255,255,255,0.02);}
.mat-name{font-weight:600;color:var(--text);}
.mat-qty{font-weight:700;color:var(--accent);text-align:right;white-space:nowrap;}
.mat-type{display:inline-block;font-size:0.65rem;font-weight:700;padding:1px 6px;border-radius:5px;margin-top:3px;}
.mat-type.service{background:rgba(79,110,247,0.12);color:var(--accent);}
.mat-desc{font-size:0.72rem;color:var(--muted);margin-top:2px;}
.mat-type.material{background:rgba(34,197,94,0.12);color:var(--green);}
.mat-status-pill{display:inline-block;font-size:0.65rem;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:middle;}
.mat-status-pill.ordered{background:rgba(245,158,11,0.13);color:var(--amber);}
.mat-status-pill.received{background:rgba(34,197,94,0.13);color:var(--green);}
#auth-screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 70px);padding:32px;}
#auth-screen.show{display:flex;}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px;width:100%;max-width:420px;text-align:center;}
.auth-card h2{margin-bottom:8px;}
.auth-card p{color:var(--muted);font-size:0.9rem;margin-bottom:24px;}
.auth-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 24px;background:var(--accent);color:#fff;border-radius:10px;font-size:1rem;font-weight:700;text-decoration:none;border:none;cursor:pointer;}
.auth-btn:hover{opacity:0.85;}
#toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 18px;font-size:0.88rem;z-index:400;transform:translateY(80px);opacity:0;transition:all 0.3s;max-width:320px;pointer-events:none;}
#toast.show{transform:translateY(0);opacity:1;}
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
      <rect width="32" height="32" rx="8" fill="#4f6ef7"/>
      <path d="M8 22 L16 10 L24 22" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="16" cy="22" r="2.5" fill="white"/>
    </svg>
    Asset Tracker
  </a>
  <div class="header-right">
    <span class="user-badge" id="user-badge"></span>
    <a class="back-btn" href="index.html">&#8592; Dashboard</a>
    <a class="back-btn" href="tasks.html">&#10003; Tasks</a>
    <a class="back-btn" href="parts.html">&#128230; Parts</a>
    <button class="btn-ghost btn-sm" onclick="loadJobs(true)">&#8635; Refresh</button>
    <a href="/api/logout" class="btn-ghost btn-sm" style="text-decoration:none;">Sign Out</a>
  </div>
</header>

<div id="auth-screen">
  <div class="auth-card">
    <h2>Session Expired</h2>
    <p>Please sign in again to continue.</p>
    <a class="auth-btn" href="index.html">&#8594; Sign In</a>
  </div>
</div>

<div class="page" id="main-page" style="display:none">
  <div class="page-header">
    <div class="page-header-left">
      <h1>&#128188; Jobs</h1>
      <p>Active quotes and work orders grouped by category.</p>
    </div>
    <div class="page-header-right">
      <div class="status-toggle">
        <button class="status-btn active" id="filter-both"  onclick="setStatusFilter('both')">All</button>
        <button class="status-btn"        id="filter-wo"    onclick="setStatusFilter('wo')">&#127959; Work Orders</button>
        <button class="status-btn"        id="filter-quote" onclick="setStatusFilter('quote')">&#128203; Quotes</button>
      </div>
    </div>
  </div>

  <div class="stats-bar" id="stats-bar"></div>

  <div class="sync-bar">
    <span id="sync-detail">Loading&hellip;</span>
    <a style="color:var(--accent);font-size:0.78rem;font-weight:600;text-decoration:none;"
       href="https://go.servicem8.com" target="_blank" rel="noopener">&#128279; Open ServiceM8</a>
  </div>

  <div class="toolbar">
    <input type="text" id="q-search" placeholder="&#128269; Search jobs or clients&hellip;" oninput="render()"/>
    <select id="q-client" onchange="render()"><option value="">All Clients</option></select>
  </div>

  <div class="kanban-wrap">
    <div class="kanban-board" id="kanban-board"></div>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="onOverlayClick(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&#10005;</button>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Config ─────────────────────────────────────────────
var COLUMNS = [
  { key:'Planned Maintenance', label:'Planned Maintenance', color:'#4f6ef7' },
  { key:'Repairs',             label:'Repairs',             color:'#ef4444' },
  { key:'Remedial',            label:'Remedial',            color:'#f59e0b' },
  { key:'Install',             label:'Install',             color:'#22c55e' }
];

// ── State ──────────────────────────────────────────────
var jobsData     = [];
var bookingsMap  = {};
var staffMap     = {};
var clientMap    = {};
var categoryMap  = {};
var partsState   = {};   // key → { ordered, received }
var jobsLoaded   = false;
var statusFilter = 'both';
var currentUser  = '';

// ── Boot ───────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function() {
  try { clientMap = JSON.parse(localStorage.getItem('sm8_clients') || '{}'); } catch(e){ clientMap={}; }
  var id = readCookies();
  currentUser = id.name || '';
  if (currentUser) document.getElementById('user-badge').textContent = '\uD83D\uDC64 ' + currentUser;
  checkSession();
});

function readCookies() {
  var r = { name:'', uuid:'' };
  document.cookie.split(';').forEach(function(c) {
    var p = c.trim().split('=');
    var k = p[0]; var v = decodeURIComponent(p.slice(1).join('='));
    if (k === 'sm8_user_name') r.name = v;
    if (k === 'sm8_user_uuid') r.uuid = v;
  });
  return r;
}

// ── Session ────────────────────────────────────────────
function checkSession() {
  fetch('/api/proxy?path=' + encodeURIComponent('/staff.json'), { credentials:'include' })
    .then(function(r){ if (r.status===401){ showAuth(); return null; } return r.json(); })
    .then(function(d){ if (d){ showMain(); loadJobs(false); } })
    .catch(function(){ showAuth(); });
}
function showAuth() {
  document.getElementById('auth-screen').classList.add('show');
  document.getElementById('main-page').style.display = 'none';
}
function showMain() {
  document.getElementById('auth-screen').classList.remove('show');
  document.getElementById('main-page').style.display = 'block';
}

// ── API ────────────────────────────────────────────────
function sm8Get(path) {
  return fetch('/api/proxy?path=' + encodeURIComponent(path), {
    credentials:'include',
    headers:{ 'Accept':'application/json', 'Cache-Control':'no-cache' }
  }).then(function(r){
    if (r.status === 401) throw new Error('SESSION_EXPIRED');
    return r.json().then(function(d){
      if (!r.ok) throw new Error(d.message || ('HTTP ' + r.status));
      return d;
    });
  });
}

// ── Load ───────────────────────────────────────────────
function loadJobs(force) {
  if (jobsLoaded && !force) return;
  jobsLoaded = false;
  setBody('<div class="loading-wrap"><span class="loader"></span><p style="margin-top:14px">Loading jobs&hellip;</p></div>');
  setSyncMsg('Loading&hellip;');

    Promise.all([
    sm8Get('/job.json'),
    sm8Get('/staff.json'),
    sm8Get('/category.json'),
    sm8Get('/company.json'),
    sm8Get('/jobactivity.json'),
    sm8Get('/jobmaterial.json'),
    sm8Get('/material.json'),
    fetch('/api/parts').then(function(r){ return r.json(); }).catch(function(){ return {}; })
  ]).then(function(res) {
    var rawJobs       = Array.isArray(res[0]) ? res[0] : [];
    var rawStaff      = Array.isArray(res[1]) ? res[1] : [];
    var rawCategories = Array.isArray(res[2]) ? res[2] : [];
    var rawCompanies  = Array.isArray(res[3]) ? res[3] : [];
    var rawActivities = Array.isArray(res[4]) ? res[4] : [];
    var rawMaterials  = Array.isArray(res[5]) ? res[5] : [];
    var rawCatalogue  = Array.isArray(res[6]) ? res[6] : [];
    partsState        = (res[7] && typeof res[7] === 'object' && !Array.isArray(res[7])) ? res[7] : {};

    // Material catalogue map: uuid → short name
    var catalogueMap = {};
    rawCatalogue.forEach(function(c) {
      if (c.uuid) catalogueMap[c.uuid] = c.name || '';
    });

    // Staff map
    staffMap = {};
    rawStaff.filter(function(s){ return String(s.active)==='1'; }).forEach(function(s){
      staffMap[s.uuid] = ((s.first||'')+' '+(s.last||'')).trim() || s.email || s.uuid;
    });

    // Category map
    categoryMap = {};
    rawCategories.filter(function(c){ return String(c.active)==='1'; }).forEach(function(c){
      categoryMap[c.uuid] = c.name || '';
    });

    // Client map
    rawCompanies.filter(function(c){ return String(c.active)==='1'; }).forEach(function(c){
      clientMap[c.uuid] = c.name || '';
    });

    // Bookings map
    bookingsMap = {};
    rawActivities.forEach(function(a) {
      if (!a.job_uuid) return;
      var dateStr = a.start_date || a.date || '';
      if (!dateStr) return;
      if (!bookingsMap[a.job_uuid]) bookingsMap[a.job_uuid] = [];
      bookingsMap[a.job_uuid].push(a);
    });
    Object.keys(bookingsMap).forEach(function(jid) {
      bookingsMap[jid].sort(function(a, b) {
        return (a.start_date||a.date||'').localeCompare(b.start_date||b.date||'');
      });
    });

       // Materials map
    var materialsMap = {};
    rawMaterials.forEach(function(m) {
      if (!m.job_uuid) return;
      if (m.active !== 1 && String(m.active) !== '1') return;
      if (!materialsMap[m.job_uuid]) materialsMap[m.job_uuid] = [];
      // Attach short catalogue name
      m._catalogueName = catalogueMap[m.material_uuid] || '';
      materialsMap[m.job_uuid].push(m);
    });

    // Filter and map jobs
    var colKeys = COLUMNS.map(function(c){ return c.key.toLowerCase(); });
    jobsData = rawJobs.filter(function(j) {
      if (String(j.active) !== '1') return false;
      var s = j.status || '';
      if (s !== 'Work Order' && s !== 'Quote') return false;
      var catName = (categoryMap[j.category_uuid] || '').toLowerCase();
      return colKeys.indexOf(catName) !== -1;
    }).map(function(j) {
      var catName     = categoryMap[j.category_uuid] || '';
      var bookings    = bookingsMap[j.uuid] || [];
      var nextBooking = getNextBooking(bookings);
      var materials   = materialsMap[j.uuid] || [];
      return {
        uuid:        j.uuid,
        number:      j.generated_job_id || '',
        desc:        j.job_description  || '',
        status:      j.status           || '',
        category:    catName,
        clientUuid:  j.company_uuid     || '',
        clientName:  clientMap[j.company_uuid] || '',
        staffUuid:   j.assigned_to_staff_uuid || '',
        staffName:   staffMap[j.assigned_to_staff_uuid] || '',
        date:        j.date             || '',
        bookings:    bookings,
        nextBooking: nextBooking,
        materials:   materials,
        _raw:        j
      };
    });

    jobsLoaded = true;
    setSyncMsg('Last synced: ' + new Date().toLocaleTimeString() + ' \u2014 ' + jobsData.length + ' active jobs');
    populateClientFilter();
    render();

  }).catch(function(e) {
    if (e.message === 'SESSION_EXPIRED') { showAuth(); return; }
    setBody('<div class="empty-wrap"><div class="empty-icon">&#9888;</div>'
      + '<p>Failed to load: ' + esc(e.message) + '</p><br/>'
      + '<button class="btn-ghost" onclick="loadJobs(true)">Retry</button></div>');
    toast('Load failed: ' + e.message, true);
  });
}

function getNextBooking(bookings) {
  if (!bookings || !bookings.length) return null;
  var today = new Date(); today.setHours(0,0,0,0);
  var future = bookings.filter(function(b) {
    var d = new Date((b.start_date || b.date || '').substring(0,10) + 'T00:00:00');
    return !isNaN(d.getTime()) && d >= today;
  });
  return future.length ? future[0] : bookings[bookings.length - 1];
}

// ── Parts state helpers ────────────────────────────────
// The parts key is: clientUuid + '__' + materialName.toLowerCase().trim()
// On the job card we compute a summary across all materials for this job
function getJobPartsSummary(j) {
  if (!j.materials || !j.materials.length) return null;
  // Only relevant for Work Orders
  if (j.status !== 'Work Order') return null;

  var total    = 0;
  var ordered  = 0;
  var received = 0;

  // Deduplicate by normalised name (same logic as parts.html consolidation)
  var seen = {};
  j.materials.forEach(function(m) {
    var normKey = (m.name || '').toLowerCase().trim();
    if (seen[normKey]) return;
    seen[normKey] = true;
    var stateKey = j.clientUuid + '__' + normKey;
    var st = partsState[stateKey] || { ordered: false, received: false };
    total++;
    if (st.received) received++;
    else if (st.ordered) ordered++;
  });

  return { total: total, ordered: ordered, received: received };
}

// ── Filters ────────────────────────────────────────────
function populateClientFilter() {
  var sel = document.getElementById('q-client');
  var cur = sel.value;
  sel.innerHTML = '<option value="">All Clients</option>';
  var seen = {};
  jobsData.forEach(function(j){ if (j.clientUuid && j.clientName) seen[j.clientUuid] = j.clientName; });
  Object.keys(seen).sort(function(a,b){ return seen[a].localeCompare(seen[b]); }).forEach(function(u){
    var o = document.createElement('option');
    o.value = u; o.textContent = seen[u];
    if (u === cur) o.selected = true;
    sel.appendChild(o);
  });
}

function setStatusFilter(f) {
  statusFilter = f;
  ['both','wo','quote'].forEach(function(k){
    document.getElementById('filter-'+k).classList.toggle('active', k===f);
  });
  render();
}

function getFiltered() {
  var q       = (document.getElementById('q-search').value || '').toLowerCase();
  var clientF = document.getElementById('q-client').value;
  return jobsData.filter(function(j) {
    if (statusFilter === 'wo'    && j.status !== 'Work Order') return false;
    if (statusFilter === 'quote' && j.status !== 'Quote')      return false;
    if (clientF && j.clientUuid !== clientF) return false;
    if (q) {
      var hay = [j.number, j.desc, j.clientName, j.category, j.staffName].join(' ').toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}

// ── Render ─────────────────────────────────────────────
function render() {
  if (!jobsLoaded) return;
  var filtered = getFiltered();
  renderStats(filtered);

  var html = '';
  COLUMNS.forEach(function(col) {
    var jobs = filtered.filter(function(j){
      return j.category.toLowerCase() === col.key.toLowerCase();
    });
    jobs.sort(function(a, b) {
      var sa = a.status === 'Work Order' ? 0 : 1;
      var sb = b.status === 'Work Order' ? 0 : 1;
      if (sa !== sb) return sa - sb;
      var da = a.nextBooking ? (a.nextBooking.start_date||a.nextBooking.date||'9999') : '9999';
      var db = b.nextBooking ? (b.nextBooking.start_date||b.nextBooking.date||'9999') : '9999';
      return da.localeCompare(db);
    });
    html += '<div class="kanban-col">'
      + '<div class="kanban-col-header">'
      + '<span class="col-dot" style="background:' + col.color + '"></span>'
      + esc(col.label)
      + '<span class="col-count">' + jobs.length + '</span>'
      + '</div>'
      + '<div class="kanban-cards">'
      + (jobs.length ? jobs.map(jobCard).join('') : '<div class="no-jobs">No jobs</div>')
      + '</div></div>';
  });

  document.getElementById('kanban-board').innerHTML = html;
}

function renderStats(filtered) {
  var wo     = filtered.filter(function(j){ return j.status === 'Work Order'; }).length;
  var quote  = filtered.filter(function(j){ return j.status === 'Quote'; }).length;
  var booked = filtered.filter(function(j){ return !!j.nextBooking; }).length;
  var total  = filtered.length;
  document.getElementById('stats-bar').innerHTML =
    stat(total,  'Total Jobs',   'var(--text)')   +
    stat(wo,     'Work Orders',  'var(--green)')  +
    stat(quote,  'Quotes',       'var(--amber)')  +
    stat(booked, 'Booked',       'var(--accent)');
}

function stat(v,l,c) {
  return '<div class="stat-card"><div class="stat-val" style="color:'+c+'">'+v+'</div><div class="stat-lbl">'+l+'</div></div>';
}

// ── Job card ───────────────────────────────────────────
function jobCard(j) {
  var isWO     = j.status === 'Work Order';
  var colorCls = isWO ? 'status-wo' : 'status-quote';
  var badgeCls = isWO ? 'wo' : 'quote';
  var badgeLbl = isWO ? '&#127959; Work Order' : '&#128203; Quote';

  var bookingHTML = j.nextBooking
    ? (function(){
        var nb = j.nextBooking;
        var dStr = nb.start_date || nb.date || '';
        var d = dStr ? new Date(dStr.substring(0,10)+'T00:00:00') : null;
        var today = new Date(); today.setHours(0,0,0,0);
        var isFuture = d && d >= today;
        return '<div class="job-booking has-booking">&#128197; '
          + (d ? fmtDate(dStr) : '\u2014')
          + (nb.start_time ? ' &middot; ' + nb.start_time.substring(0,5) : '')
          + (isFuture ? ' <span style="color:var(--green);font-weight:700">\u2713 Upcoming</span>' : '')
          + '</div>';
      })()
    : '<div class="job-booking no-booking">&#128197; No booking scheduled</div>';

  // Parts summary pill — only on Work Orders with materials
  var partsPill = '';
  var summary = getJobPartsSummary(j);
  if (summary) {
    var remaining = summary.total - summary.received;
    if (summary.received === summary.total) {
      // All received
      partsPill = '<a class="parts-link-btn all-received" href="parts.html" onclick="event.stopPropagation()">'
        + '&#10003; All ' + summary.total + ' parts received</a>';
    } else if (summary.ordered > 0 || summary.received > 0) {
      // Some progress
      partsPill = '<a class="parts-link-btn some-ordered" href="parts.html" onclick="event.stopPropagation()">'
        + '&#128230; ' + summary.received + '/' + summary.total + ' received'
        + (summary.ordered > 0 ? ' &middot; ' + summary.ordered + ' ordered' : '')
        + '</a>';
    } else {
      // Nothing ordered yet
      partsPill = '<a class="parts-link-btn needs-order" href="parts.html" onclick="event.stopPropagation()">'
        + '&#9888; ' + remaining + ' part' + (remaining === 1 ? '' : 's') + ' need ordering</a>';
    }
  }

  var sm8Btn = j.uuid
    ? '<a class="open-sm8-btn" href="https://go.servicem8.com/openjob/'+esc(j.uuid)+'"'
      + ' target="_blank" rel="noopener" onclick="event.stopPropagation()">&#128279; Open</a>'
    : '';

  return '<div class="job-card ' + colorCls + '" onclick="openJobModal(\'' + esc(j.uuid) + '\')">'
    + '<div class="job-card-top">'
    +   '<span class="job-number">Job #' + esc(j.number) + '</span>'
    +   '<span class="job-status-badge ' + badgeCls + '">' + badgeLbl + '</span>'
    + '</div>'
    + '<div class="job-desc">' + esc(j.desc || 'No description') + '</div>'
    + (j.clientName ? '<div class="job-client">&#128205; ' + esc(j.clientName) + '</div>' : '')
    + '<div class="job-meta">'
    +   (j.staffName ? '<span class="job-meta-item">&#128100; ' + esc(j.staffName) + '</span>' : '')
    +   (j.date      ? '<span class="job-meta-item">&#128336; ' + fmtDate(j.date) + '</span>' : '')
    + '</div>'
    + bookingHTML
    + (partsPill ? '<div style="margin-bottom:8px">' + partsPill + '</div>' : '')
    + '<div class="job-card-actions" style="margin-top:8px">' + sm8Btn + '</div>'
    + '</div>';
}

// ── Job modal ──────────────────────────────────────────
function openJobModal(uuid) {
  var j = jobsData.find(function(x){ return x.uuid === uuid; });
  if (!j) return;

  var isWO     = j.status === 'Work Order';
  var badgeCls = isWO ? 'badge-wo'    : 'badge-quote';
  var badgeLbl = isWO ? '&#127959; Work Order' : '&#128203; Quote';

  // Bookings HTML
  var bookingsHTML = '';
  if (j.bookings && j.bookings.length) {
    var today = new Date(); today.setHours(0,0,0,0);
    var future = j.bookings.filter(function(b){
      var d = new Date((b.start_date||b.date||'').substring(0,10)+'T00:00:00');
      return !isNaN(d.getTime()) && d >= today;
    });
    var past = j.bookings.filter(function(b){
      var d = new Date((b.start_date||b.date||'').substring(0,10)+'T00:00:00');
      return isNaN(d.getTime()) || d < today;
    });
    if (future.length) {
      bookingsHTML += '<div class="modal-section-title">&#128197; Upcoming Bookings</div>';
      future.forEach(function(b, i) {
        var dStr  = b.start_date || b.date || '';
        var sName = staffMap[b.staff_uuid] || b.staff_uuid || '';
        bookingsHTML += '<div class="booking-card' + (i===0?' next':'') + '">'
          + (i===0 ? '<div class="booking-label">&#9733; Next Booking</div>' : '')
          + '<div class="booking-date">' + fmtDate(dStr) + '</div>'
          + (b.start_time ? '<div class="booking-time">&#128336; ' + esc(b.start_time.substring(0,5))
              + (b.end_time ? ' &ndash; ' + esc(b.end_time.substring(0,5)) : '') + '</div>' : '')
          + (sName ? '<div class="booking-staff">&#128100; ' + esc(sName) + '</div>' : '')
          + '</div>';
      });
    }
    if (past.length) {
      bookingsHTML += '<div class="modal-section-title" style="margin-top:14px">&#128336; Past Bookings</div>';
      past.slice().reverse().slice(0,5).forEach(function(b){
        var dStr  = b.start_date || b.date || '';
        var sName = staffMap[b.staff_uuid] || b.staff_uuid || '';
        bookingsHTML += '<div class="booking-card">'
          + '<div class="booking-date" style="color:var(--muted)">' + fmtDate(dStr) + '</div>'
          + (b.start_time ? '<div class="booking-time">&#128336; ' + esc(b.start_time.substring(0,5)) + '</div>' : '')
          + (sName ? '<div class="booking-staff">&#128100; ' + esc(sName) + '</div>' : '')
          + '</div>';
      });
    }
  } else {
    bookingsHTML = '<div style="color:var(--muted);font-size:0.85rem;padding:10px 0">No bookings found for this job.</div>';
  }

  var raw = j._raw;
  var fieldsHTML =
    fieldRow('Job Number',  '#' + esc(j.number)) +
    fieldRow('Status',      '<span class="badge ' + badgeCls + '">' + badgeLbl + '</span>') +
    fieldRow('Category',    esc(j.category)) +
    fieldRow('Client',      esc(j.clientName || '\u2014')) +
    fieldRow('Assigned To', esc(j.staffName  || 'Unassigned')) +
    fieldRow('Job Date',    fmtDate(j.date)) +
    fieldRow('Created',     fmtDate(raw.date_created || ''));

  document.getElementById('modal-body').innerHTML =
    '<h3>' + esc(j.desc || 'Job #' + j.number) + '</h3>'
    + '<div class="modal-sub">'
    +   '<span class="badge ' + badgeCls + '">' + badgeLbl + '</span>'
    +   '<span style="color:var(--muted)">Job #' + esc(j.number) + '</span>'
    +   (j.clientName ? '<span style="color:var(--accent)">&#128205; ' + esc(j.clientName) + '</span>' : '')
    + '</div>'
    + '<a class="modal-sm8-link" href="https://go.servicem8.com/openjob/' + esc(j.uuid) + '"'
    +   ' target="_blank" rel="noopener">&#128279; Open Job in ServiceM8</a>'
    + '<div class="modal-section">'
    +   '<div class="modal-section-title">&#128188; Job Details</div>'
    +   fieldsHTML
    + '</div>'
    + '<div class="modal-section">'
    +   bookingsHTML
    + '</div>'
    + '<div class="modal-section">'
    +   '<div class="modal-section-title">&#128230; Materials &amp; Services</div>'
    +   buildMaterialsHTML(j)
    + '</div>';

  document.getElementById('modal').classList.add('open');
}

function fieldRow(label, value) {
  return '<div class="field-row">'
    + '<span class="field-label">' + label + '</span>'
    + '<span class="field-value">' + value + '</span>'
    + '</div>';
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }
function onOverlayClick(e) { if (e.target === document.getElementById('modal')) closeModal(); }

// ── Materials (with parts status in modal) ─────────────
function buildMaterialsHTML(j) {
  var materials = j.materials;
  if (!materials || !materials.length) {
    return '<div style="color:var(--muted);font-size:0.85rem;padding:10px 0">No materials or services on this job.</div>';
  }

  var sorted = materials.slice().sort(function(a, b) {
    var sa = parseInt(a.sort_order || 0, 10);
    var sb = parseInt(b.sort_order || 0, 10);
    if (sa !== sb) return sa - sb;
    return (a.name || '').localeCompare(b.name || '');
  });

  function guessType(name) {
    if (/labour|labor|travel|call.?out|service.?fee|hire|inspection|freight|delivery/i.test(name||'')) return 'service';
    return 'material';
  }

  var serviceCount  = 0;
  var materialCount = 0;

  var rows = sorted.map(function(m) {
    var description = (m.name || 'Unnamed Item').trim();
    var shortName   = (m._catalogueName || '').trim();
    var qty         = parseFloat(m.quantity || 1);
    var qtyStr      = Number.isInteger(qty) ? String(qty) : qty.toFixed(2).replace(/\.?0+$/, '');
    var type        = guessType(description);
    if (type === 'service') serviceCount++; else materialCount++;
    var typeCls     = type === 'service' ? 'service' : 'material';
    var typeLbl     = type === 'service' ? 'Service'  : 'Material';

    // Parts status badge (only for WO materials)
    var statusBadge = '';
    if (j.status === 'Work Order' && type === 'material') {
      var stateKey = j.clientUuid + '__' + description.toLowerCase().trim();
      var st = partsState[stateKey] || { ordered: false, received: false };
      if (st.received) {
        statusBadge = '<span class="mat-status-pill received">&#10003; Received</span>';
      } else if (st.ordered) {
        statusBadge = '<span class="mat-status-pill ordered">&#128230; Ordered</span>';
      }
    }

    return '<tr>'
      + '<td>'
      +   (shortName
            ? '<div class="mat-name">' + esc(shortName) + statusBadge + '</div>'
            +   '<div class="mat-desc">' + esc(description) + '</div>'
            : '<div class="mat-name">' + esc(description) + statusBadge + '</div>'
          )
      +   '<span class="mat-type ' + typeCls + '">' + typeLbl + '</span>'
      + '</td>'
      + '<td class="mat-qty">' + esc(qtyStr) + '</td>'
      + '</tr>';
  }).join('');

  var summary = '';
  if (serviceCount)  summary += serviceCount  + ' service'  + (serviceCount  > 1 ? 's' : '');
  if (materialCount) summary += (summary ? ', ' : '') + materialCount + ' material' + (materialCount > 1 ? 's' : '');
  if (!summary)      summary = sorted.length + ' item' + (sorted.length > 1 ? 's' : '');

  var partsLink = j.status === 'Work Order' && materialCount > 0
    ? ' &nbsp;<a href="parts.html" style="font-size:0.72rem;color:var(--accent);text-decoration:none;">&#128230; Manage parts &rarr;</a>'
    : '';

  return '<div style="font-size:0.75rem;color:var(--muted);margin-bottom:10px;">' + summary + partsLink + '</div>'
    + '<table class="materials-table">'
    + '<thead><tr><th>Name / Description</th><th style="text-align:right;width:60px">Qty</th></tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '</table>';
}


// ── Helpers ────────────────────────────────────────────
function fmtDate(str) {
  if (!str) return '\u2014';
  var m = String(str).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return str;
  return new Date(+m[1], +m[2]-1, +m[3]).toLocaleDateString('en-AU', { day:'2-digit', month:'short', year:'numeric' });
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function setBody(html)    { document.getElementById('kanban-board').innerHTML = html; }
function setSyncMsg(html) { document.getElementById('sync-detail').innerHTML  = html; }

var toastTimer = null;
function toast(msg, isError) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = isError ? 'var(--red)' : 'var(--green)';
  el.style.color       = isError ? 'var(--red)' : 'var(--text)';
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 3500);
}
</script>
</body>
